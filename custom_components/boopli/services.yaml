add_task:
  fields:
    title:
      required: true
      example: "Move the laundry to the dryer"
      selector:
        text:
    steps:
      required: false
      example: '["Take it out", "Put it in the dryer"]'
      selector:
        text:
          multiple: true
    where:
      required: false
      default: home
      selector:
        select:
          options:
            - home
            - anywhere
          translation_key: where

start_chore:
  fields:
    chore:
      required: true
      example: "Dishwasher"
      selector:
        text:

complete_step:
  fields:
    chore:
      required: true
      example: "Dishwasher"
      selector:
        text:

snooze_step:
  fields:
    chore:
      required: true
      example: "Dishwasher"
      selector:
        text:

delete_chore:
  fields:
    chore:
      required: true
      example: "Dishwasher"
      selector:
        text:
