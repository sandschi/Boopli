add_task:
  fields:
    title:
      required: true
      example: "Move the laundry to the dryer"
      selector:
        text:
    steps:
      required: false
      example: '["Take it out", "Put it in the dryer"]'
      selector:
        text:
          multiple: true
    where:
      required: false
      default: home
      selector:
        select:
          options:
            - home
            - anywhere
          translation_key: where

break_down:
  fields:
    task:
      required: true
      example: "Clean the bathroom"
      selector:
        text:
    kind:
      required: false
      default: now
      selector:
        select:
          options:
            - now
            - recurring
    answers:
      required: false
      example: '[{"question": "How does the floor look?", "answer": "A few things on it"}]'
      selector:
        object:
    notes:
      required: false
      example: "Bathroom has: shower, sink, toilet, floor."
      selector:
        text:
          multiline: true
    rooms:
      required: false
      example: '["Bathroom"]'
      selector:
        object:

start_chore:
  fields:
    chore:
      required: true
      example: "Dishwasher"
      selector:
        text:

complete_step:
  fields:
    chore:
      required: true
      example: "Dishwasher"
      selector:
        text:

snooze_step:
  fields:
    chore:
      required: true
      example: "Dishwasher"
      selector:
        text:

delete_chore:
  fields:
    chore:
      required: true
      example: "Dishwasher"
      selector:
        text:

set_away:
  fields:
    start:
      required: false
      example: "2026-11-28 08:00"
      selector:
        text:
    until:
      required: false
      example: "2026-12-05 18:00"
      selector:
        text:

end_away:
